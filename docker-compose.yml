services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: pulseforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulseforge
      POSTGRES_USER: pulseforge
      POSTGRES_PASSWORD: pulseforge_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseforge -d pulseforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulseforge-net

  redis:
    image: redis:7-alpine
    container_name: pulseforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulseforge-net

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: pulseforge-backend-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://pulseforge:pulseforge_secret@postgres:5432/pulseforge?sslmode=disable
      REDIS_URL: redis://redis:6379
      AUTH_JWT_ACCESS_SECRET: dev_super_secret_jwt_access_key_min_32_bytes_long!
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pulseforge-net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: pulseforge-worker
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://pulseforge:pulseforge_secret@postgres:5432/pulseforge?sslmode=disable
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pulseforge-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulseforge-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/api/v1/ws
    depends_on:
      - backend-api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulseforge-net

volumes:
  postgres_data:
  redis_data:

networks:
  pulseforge-net:
    driver: bridge
